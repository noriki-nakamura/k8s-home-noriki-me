apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: kube-system
---
# 組み込み ClusterRole "view": namespace配下リソースの読み取り(Secrets等機微情報は対象外)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# "view" だけではNode等cluster-scopedリソースが見えないため追加で定義
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-view
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-cluster-view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: headlamp-cluster-view
  apiGroup: rbac.authorization.k8s.io
---
# 長期間有効なトークン（kubectl create token はデフォルト1時間で失効するため）
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-viewer-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: headlamp-viewer
type: kubernetes.io/service-account-token
