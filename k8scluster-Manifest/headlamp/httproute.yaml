apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: kube-system
spec:
  parentRefs:
    - name: home-k8s-gateway
      namespace: default
  hostnames:
    - "k8s-dashboard.home.noriki.me"
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
