---
- name: Kubernetes yum リポジトリを配置
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/repodata/repomd.xml.key"
    exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

- name: kubelet / kubeadm / kubectl をインストール（バージョン指定なし）
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes
  when: k8s_package_version | length == 0

- name: kubelet / kubeadm / kubectl をインストール（バージョン固定）
  ansible.builtin.dnf:
    name:
      - "kubelet-{{ k8s_package_version }}"
      - "kubeadm-{{ k8s_package_version }}"
      - "kubectl-{{ k8s_package_version }}"
    state: present
    disable_excludes: kubernetes
  when: k8s_package_version | length > 0

- name: dnf versionlock プラグインをインストール
  ansible.builtin.dnf:
    name: python3-dnf-plugin-versionlock
    state: present

- name: kubelet / kubeadm / kubectl をバージョンロック
  ansible.builtin.command: dnf versionlock add kubelet kubeadm kubectl
  changed_when: true

- name: kubelet を有効化（起動は kubeadm init/join 後に安定する）
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: crictl のデフォルトエンドポイントを設定
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false
    owner: root
    group: root
    mode: "0644"
