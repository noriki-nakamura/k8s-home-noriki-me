---
# 各ノードの ansible_host は k8s 専用 VLAN 上で採番した固定IPに置き換えてください。
# VM は Proxmox 上に別手段（手動 or Terraform 等）で作成済みであることが前提です。
all:
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            k8s-cp-01:
              ansible_host: 10.32.192.11
            k8s-cp-02:
              ansible_host: 10.32.192.12
            k8s-cp-03:
              ansible_host: 10.32.192.13
        workers:
          hosts:
            k8s-worker-01:
              ansible_host: 10.32.192.21
            k8s-worker-02:
              ansible_host: 10.32.192.22
