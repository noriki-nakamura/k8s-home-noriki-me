[defaults]
# VM-Ansible のinventoryを共有する（ノード接続情報を二重管理しないため）
inventory = ../VM-Ansible/inventory/hosts.yml
remote_user = almalinux
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
roles_path = roles

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
